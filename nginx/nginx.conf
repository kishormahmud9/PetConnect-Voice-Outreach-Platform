server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; img-src 'self' data:;" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Proxy all traffic to the FastAPI app
    location / {
        proxy_pass http://vetpay-app:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for file uploads (CSV) — allow up to 10MB
        client_max_body_size 10M;

        # Timeouts — outbound call setup can take a few seconds
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Serve audio files directly from the shared volume for efficiency
    location /audio/ {
        alias /app/audio/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        types {
            audio/mpeg mp3;
        }
    }

    # Health check endpoint (bypass auth for load balancer probes)
    location /health {
        proxy_pass http://vetpay-app:8000/login;
        access_log off;
    }
}

