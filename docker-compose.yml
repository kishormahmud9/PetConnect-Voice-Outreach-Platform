# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.yml  (Base / Development)
# Usage: docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI Application ───────────────────────────────────────────────────
  vetpay-app:
    build:
      context: ./ai-codebase
      dockerfile: Dockerfile
    container_name: vetpay-app
    restart: unless-stopped
    env_file:
      - ./ai-codebase/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    ports:
      - "8000:8000"          # Direct access in dev; in prod only nginx exposes
    volumes:
      # Persist generated audio files across restarts
      - vetpay-audio:/app/audio
      # Persist output result CSVs across restarts
      - vetpay-results:/app/output_results
      # Persist the SQLite user database across restarts
      - vetpay-db:/app/users.db
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/login')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - vetpay-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  vetpay-nginx:
    image: nginx:1.25-alpine
    container_name: vetpay-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Share the same audio volume so nginx can serve MP3s directly
      - vetpay-audio:/app/audio:ro
    depends_on:
      vetpay-app:
        condition: service_healthy
    networks:
      - vetpay-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

# ── Named Volumes ─────────────────────────────────────────────────────────────
volumes:
  vetpay-audio:
    driver: local
  vetpay-results:
    driver: local
  vetpay-db:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  vetpay-network:
    driver: bridge
